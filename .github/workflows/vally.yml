name: Vally skill evaluations

on:
  pull_request:
    paths:
      - "SKILL.md"
      - "references/**"
      - "runtime/**"
      - "tests/scenarios/**/vally/**"
      - ".github/workflows/vally.yml"
  push:
    branches: [main]
    paths:
      - "SKILL.md"
      - "references/**"
      - "runtime/**"
      - "tests/scenarios/**/vally/**"
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_COPILOT_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: Install Vally
        run: npm install -g @microsoft/vally-cli@0.10.0
      - name: Lint evaluations
        run: vally lint --eval-spec tests/scenarios/fabric-plan/vally/eval.yaml --strict
      - name: Run evaluations
        run: |
          mkdir -p vally-results
          vally eval -e tests/scenarios/fabric-plan/vally/eval.yaml \
            --junit --output-dir vally-results --workers 1
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vally-results
          path: vally-results
          if-no-files-found: ignore
